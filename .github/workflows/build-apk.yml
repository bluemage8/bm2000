name: Build Android APK

# Builds the bm2000 Android app (Kotlin + WebView) on every push to main, and
# publishes the APK as a GitHub Release when a version tag (v1.2.3) is pushed.
#
# The repo does not ship the Gradle wrapper jar (a large binary), so this
# workflow provisions Gradle 8.7 + JDK 17 + the Android SDK via the standard
# actions.  The APK is a debug-signed build (installable as-is); a release
# build would need a signing key stored as a repository secret.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate the APK
        id: locate
        run: |
          apk=$(ls -1 app/build/outputs/apk/debug/*.apk | head -1)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "Found APK: $apk"
        working-directory: android

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bm2000-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
